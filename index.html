    <div id="root"></div>
    <!-- GitHub Pages SPA fallback: restore the deep-link path from ?p=... that
         404.html wrote into the URL, so React Router sees the correct route. -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          history.replaceState(null, '', p || '/');
        }
      })();
    </script>

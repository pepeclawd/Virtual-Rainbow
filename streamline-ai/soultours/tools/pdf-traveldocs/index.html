<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Travel Docs | SoulTours Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      if (localStorage.getItem('vr-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f4ff;
      --card-bg: #ffffff;
      --border: rgba(80,60,200,0.12);
      --text: #0d0c1d;
      --muted: rgba(13,12,29,0.5);
      --nav-bg: rgba(245,244,255,0.92);
      --vr-gradient: linear-gradient(135deg, #7b2fff, #ff2fa0, #ff9f2f, #2fffb0);
      --accent: #6c22ff;
      --accent-bright: #6c22ff;
      --accent-soft: rgba(108,34,255,0.08);
    }

    [data-theme="dark"] {
      --bg: #06060e;
      --card-bg: rgba(255,255,255,0.02);
      --border: rgba(255,255,255,0.07);
      --text: #f0f0ff;
      --muted: rgba(240,240,255,0.45);
      --nav-bg: rgba(6,6,14,0.9);
      --accent: #7b2fff;
      --accent-bright: #a97dff;
      --accent-soft: rgba(123,47,255,0.1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    .rainbow-bar { height: 2px; background: var(--vr-gradient); }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 64px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      z-index: 100;
      transition: background 0.3s, border-color 0.3s;
    }

    .vr-logo {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--vr-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .vr-logo:hover { opacity: 1; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-right-label {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .theme-toggle {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle:hover { border-color: var(--text); color: var(--text); }

    .main {
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 40px;
      width: 100%;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .breadcrumb a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--text); }
    .breadcrumb-sep { opacity: 0.4; }
    .breadcrumb-current { color: var(--accent-bright); }

    .tool-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .tool-header-icon { font-size: 2.5rem; }

    .tool-header h1 {
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tool-header p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .tool-body {
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: var(--card-bg);
      transition: background 0.3s, border-color 0.3s;
    }

    .tool-body iframe {
      width: 100%;
      height: 820px;
      border: none;
      display: block;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 28px 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer span { font-size: 0.8rem; color: var(--muted); }

    .footer-logo {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--vr-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .footer-logo:hover { opacity: 1; }

    @media (max-width: 900px) {
      nav { padding: 20px 24px; }
      .main { padding: 20px 24px; }
      .footer { padding: 24px; flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="rainbow-bar"></div>

  <nav>
    <a href="/index.html" class="vr-logo">Virtual Rainbow</a>
    <div class="nav-right">
      <span class="nav-right-label">StreamlineAI · SoulTours</span>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">☾</button>
    </div>
  </nav>

  <div class="main">
    <div class="breadcrumb">
      <a href="/index.html">Virtual Rainbow</a>
      <span class="breadcrumb-sep">/</span>
      <a href="/streamline-ai.html">StreamlineAI</a>
      <span class="breadcrumb-sep">/</span>
      <a href="/streamline-ai/soultours/tools/">SoulTours Tools</a>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current">PDF Travel Docs</span>
    </div>

    <div class="tool-header">
      <span class="tool-header-icon">📄</span>
      <div>
        <h1>PDF Travel Docs</h1>
        <p>Generate professional travel documents and itineraries as ready-to-send PDFs.</p>
      </div>
    </div>

    <div class="tool-body">
      <iframe src="https://soultours-pdf-tool-production.up.railway.app" title="PDF Travel Docs Tool"></iframe>
    </div>
  </div>

  <div class="footer">
    <a href="/index.html" class="footer-logo">Virtual Rainbow</a>
    <span>Full spectrum. Fully digital.</span>
    <span>© 2026 Virtual Rainbow</span>
  </div>

  <div class="rainbow-bar"></div>

  <script>
    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('vr-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('vr-theme', 'dark');
      }
      updateToggle();
    }

    function updateToggle() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = isDark ? '☀' : '☾';
    }

    updateToggle();
  </script>

</body>
</html>

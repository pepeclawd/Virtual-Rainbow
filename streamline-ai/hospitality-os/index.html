<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Driftsoverblik · prototype</title>
<!--
  Hospitality OS: synthetic experience prototype.
  Every number is generated deterministically inside this file. No network requests, no real
  company, employee, wage, customer or transaction data. Not a POS, not a bookkeeping system,
  not an authorization design. See prototype/README.md.
-->
<style>
/* Mathias's October palette; semantic colours retain words and symbols. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#f7f8f6; --ink:#16191c; --ink-2:#3f474e; --muted:#5d666e;
  --line:#d9dde0; --line-2:#e9ecee; --focus:#1a5fd0;
  --good:#17692f; --good-bg:#e3f3e7; --warn:#7a4f00; --warn-bg:#fff1cc; --warn-mark:#c98a00;
  --bad:#a4231b; --bad-bg:#fde6e3; --info:#1f4f99; --info-bg:#e5eefb; --na:#5d666e; --na-bg:#eceeef;
  --brand:#33414d; --brand-ink:#ffffff; --brand-soft:#e8ecef; --brand-mid:#8a97a3;
  --ly:#9aa3ab; --radius:14px; --shadow:0 1px 2px rgba(20,25,30,.06),0 2px 8px rgba(20,25,30,.05);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
body[data-tenant="soehesten"]{--brand:#0a4f5c; --brand-soft:#e1eff1; --brand-mid:#2f8796;}
body[data-tenant="rannor"]{--brand:#8e3514; --brand-soft:#f7e8e0; --brand-mid:#c0643c;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:#fff;color:var(--ink);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{top:8px}

/* prototype strip */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;justify-content:space-between;background:#20262b;color:#f1f3f4;font-size:12.5px;padding:6px 16px}
.proto strong{font-weight:600}
.proto button,.proto .back{background:transparent;border:1px solid #6b757d;color:#f1f3f4;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.proto button:hover,.proto .back:hover{background:#343c43}
.proto .clock{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout */
.shell{display:block}
.brandbar{background:var(--brand);color:var(--brand-ink);padding:14px 16px 16px;position:relative}
.brandbar .row{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.brandbar .id{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 220px}
@media (max-width:639px){.who{width:100%;justify-content:space-between;border-top:1px solid rgba(255,255,255,.22);padding-top:10px}}
@media (max-width:959px){nav.tabs a.opt{display:none}}
.mono{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35)}
.mono svg{width:26px;height:26px}
.brandbar h1{margin:0;font-size:20px;line-height:1.15;letter-spacing:.1px}
.brandbar .legal{font-size:12.5px;opacity:.88;margin-top:2px}
.brandbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.chipbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.chipbtn:hover{background:rgba(255,255,255,.24)}
.brandbar .role{font-size:12.5px;opacity:.9}
main{padding:16px 16px 96px;max-width:1180px;margin:0 auto}
.page-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.page-h h2{margin:0;font-size:20px}
.page-h .sub{color:var(--muted);font-size:13.5px}
h3{font-size:15.5px;margin:0 0 8px}
.contextline{font-size:13.5px;color:var(--ink-2);margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:11.5px;min-height:56px;justify-content:center}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--brand);font-weight:650}
nav.tabs a[aria-current="page"] svg{stroke-width:2.3}
nav.tabs .dot{background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:15px;margin-left:2px}

@media (min-width:960px){
  .shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 34px)}
  .shell > .brandbar{grid-column:1 / -1}
  nav.tabs{position:sticky;top:0;align-self:start;flex-direction:column;border-top:0;border-right:1px solid var(--line);height:auto;min-height:calc(100vh - 110px);padding:12px 10px;gap:2px;background:var(--surface)}
  nav.tabs a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:10px 12px;border-radius:10px;min-height:44px}
  nav.tabs a[aria-current="page"]{background:var(--brand-soft)}
  main{padding:22px 28px 48px;width:100%}
  .brandbar{padding:16px 28px}
  .brandbar h1{font-size:23px}
}

/* cards */
.grid{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-h h3{margin:0}
.sec{margin-top:18px}
.sec > h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.home-grid{display:grid;gap:12px;grid-template-columns:1fr}
.sales-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.sales-grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:960px){
  .home-grid{grid-template-columns:repeat(12,1fr)}
  .span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
}
.tile{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.tile.linky{cursor:pointer}
.tile.linky:hover{border-color:var(--brand-mid)}
.tile .lbl{font-size:12.5px;font-weight:650;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.tile .per{font-size:12px;color:var(--muted);min-height:1.2em}
.big{font-size:24px;font-weight:720;letter-spacing:-.2px;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big.xl{font-size:34px}
.inc{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cmp{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.delta{display:inline-block;font-weight:650;font-size:13px;border-radius:8px;padding:2px 7px;margin-top:6px;align-self:flex-start;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.delta.good{background:var(--good-bg);color:var(--good)}
.delta.warn{background:var(--warn-bg);color:var(--warn)}
.delta.bad{background:var(--bad-bg);color:var(--bad)}
.delta.na{background:var(--na-bg);color:var(--na)}
.flag{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;color:var(--info);background:var(--info-bg);border-radius:8px;padding:2px 7px;margin-top:6px;align-self:flex-start}
.flag.warn{color:var(--warn);background:var(--warn-bg)}
.flag.bad{color:var(--bad);background:var(--bad-bg)}
.tile .srcbtn,.srcbtn{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:none;border:0;cursor:pointer;text-align:left;padding-left:0;padding-right:0;padding-bottom:0;min-height:28px}
.srcbtn:hover{color:var(--ink)}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--good);box-shadow:0 0 0 2px var(--surface)}
.sdot.stale,.sdot.partial,.sdot.mapping{background:var(--warn-mark)}
.sdot.unavailable{background:var(--bad)}
.sdot.loading{background:var(--info)}
.lowerb{font-size:.6em;vertical-align:.18em;margin-right:2px;color:var(--warn)}

/* urgent card */
.urgent{border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:flex-start;border:1px solid}
.urgent.sev-bad{background:var(--bad-bg);border-color:#f2b8b1}
.urgent.sev-warn{background:var(--warn-bg);border-color:#ecd28a}
.urgent.sev-good{background:var(--good-bg);border-color:#b9dfc3}
.urgent .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.urgent.sev-bad .ic{background:var(--bad)}.urgent.sev-warn .ic{background:#9a6400}.urgent.sev-good .ic{background:var(--good)}
.urgent .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.urgent.sev-bad .k{color:var(--bad)}.urgent.sev-warn .k{color:var(--warn)}.urgent.sev-good .k{color:var(--good)}
.urgent .t{font-size:17px;font-weight:700;margin:2px 0}
.urgent .d{font-size:13.5px;color:var(--ink-2)}
.urgent .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* labour gauge */
.gauge{position:relative;height:12px;border-radius:6px;background:var(--line-2);margin:10px 0 4px}
.gauge .band{position:absolute;top:0;bottom:0;background:#cfe8d6;border-left:2px solid var(--good);border-right:2px solid var(--good)}
.gauge .mark{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.gauge-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.hours{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:13.5px;margin-top:8px;align-items:center;font-variant-numeric:tabular-nums}
.hbar{height:8px;border-radius:4px;background:var(--brand-mid);min-width:2px}
.hbar.plan{background:var(--ly)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;text-align:right;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.badge.measured{background:var(--good-bg);color:var(--good)}
.badge.indicative{background:var(--warn-bg);color:var(--warn)}
.badge.urgent{background:var(--bad);color:#fff}
.badge.neutral{background:var(--na-bg);color:var(--ink-2)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}

/* sources strip */
.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.srcchip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:9px 10px;cursor:pointer;text-align:left;min-width:0;box-shadow:var(--shadow)}
.srcchip .n{font-weight:650;font-size:13px;display:flex;gap:6px;align-items:center;max-width:100%}
.srcchip .s{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.srcchip.state-stale,.srcchip.state-partial,.srcchip.state-mapping{border-color:#e6c572;background:#fffaeb}
.srcchip.state-unavailable{border-color:#f0aaa2;background:#fff5f4}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn.link{border:0;background:none;padding:4px 0;min-height:32px;color:var(--info);font-weight:600}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13.5px;min-height:38px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:650}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.addnote{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--brand-mid);color:var(--brand);background:transparent;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px;min-height:38px}
.note{background:#fffbea;border:1px solid #efdf9f;border-radius:10px;padding:8px 10px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.note .meta{font-size:12px;color:var(--muted)}

/* charts (HTML bars, readable at any width) */
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding:18px 0 0;border-bottom:1px solid var(--line);position:relative}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0;background:none;border:0;padding:0;cursor:default}
button.col{cursor:pointer}
button.col:hover .bar{filter:brightness(1.12)}
.bar{width:100%;max-width:34px;background:var(--brand-mid);border-radius:4px 4px 0 0;min-height:0}
.bar.missing{background:repeating-linear-gradient(135deg,#f0c35c 0 4px,#fff7df 4px 8px);border:1px dashed #b27a00;border-bottom:0}
.bar.future{background:transparent}
.bar.focus{background:var(--brand)}
.lytick{position:absolute;left:12%;right:12%;height:0;border-top:2.5px solid #4b5560}
.col .nm{position:absolute;top:-17px;font-size:12px}
.xlabels{display:flex;gap:3px;margin-top:4px}
.xlabels span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.legend i.cur{background:var(--brand-mid)}
.legend i.ly{height:0;border-top:2.5px solid #4b5560;border-radius:0;vertical-align:3px}
.legend i.miss{background:repeating-linear-gradient(135deg,#f0c35c 0 3px,#fff7df 3px 6px);border:1px dashed #b27a00}
details.tbl{margin-top:8px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--info);font-weight:600;min-height:32px;display:flex;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-weight:650;color:var(--ink-2);font-size:12.5px}
td.num,th.num{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.catrow{display:grid;grid-template-columns:minmax(92px,1.1fr) 2fr auto;gap:8px;align-items:center;font-size:13.5px;padding:4px 0}
.catbar{height:10px;border-radius:5px;background:var(--brand-mid)}
.catbar.err{background:repeating-linear-gradient(135deg,#d0473d 0 4px,#fde6e3 4px 8px)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.err-text{color:var(--bad)}
.good-text{color:var(--good)}
.warn-text{color:var(--warn)}
.list{list-style:none;margin:0;padding:0}
.list > li{border-top:1px solid var(--line-2);padding:10px 0}
.list > li:first-child{border-top:0}

/* employees */
.emp summary{display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer;padding:10px 0;list-style:none;align-items:center}
.emp summary::-webkit-details-marker{display:none}
.emp summary .nm{font-weight:650}
.emp summary .hrs{font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
.emp summary .sub{font-size:12.5px;color:var(--muted);grid-column:1 / -1}
.emp{border-top:1px solid var(--line-2)}
.emp[open] summary .nm::after{content:" ▴";color:var(--muted)}
.emp summary .nm::after{content:" ▾";color:var(--muted)}
.evt{font-size:13px;padding:6px 0 6px 10px;border-left:3px solid var(--line);margin:4px 0}
.evt.corr{border-left-color:var(--info)}
.evt.miss{border-left-color:var(--bad)}

/* tasks */
.task{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line-2)}
.task:first-child{border-top:0}
.task .pri{width:6px;border-radius:3px;background:var(--line)}
.task.is-urgent .pri{background:var(--bad)}
.task .tt{margin:0;font-size:15px}
.task .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.task .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photo{width:120px;height:80px;border-radius:8px;background:linear-gradient(135deg,#d7dde2,#eef1f3);display:grid;place-items:center;color:var(--muted);font-size:11px;margin-top:6px;border:1px solid var(--line)}
.status{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.status.open{background:var(--info-bg);color:var(--info)}
.status.progress{background:var(--warn-bg);color:var(--warn)}
.status.resolved{background:var(--good-bg);color:var(--good)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:14px}

/* forms */
label.f{display:block;font-weight:600;font-size:13.5px;margin:12px 0 4px}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid #aab2b9;border-radius:10px;padding:9px 11px;background:#fff;min-height:42px}
textarea{min-height:84px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;font-size:13.5px;min-height:38px}
.checks input{width:18px;height:18px;margin:0}
.checkline{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:600}
.checkline input{width:20px;height:20px}
.formerr{color:var(--bad);font-size:13px;margin-top:6px;min-height:1em}

/* dialogs */
dialog{border:0;border-radius:18px;padding:0;max-width:560px;width:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--ink)}
dialog::backdrop{background:rgba(15,20,25,.5)}
@media (max-width:639px){
  dialog{margin:auto 0 0;max-width:none;width:100%;border-radius:18px 18px 0 0;max-height:88vh}
}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fff;z-index:1}
.dlg-h h2{margin:0;font-size:18px}
.dlg-h .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.dlg-b{padding:12px 16px 18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.xbtn{border:0;background:var(--surface-2);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:20px;line-height:1;flex:none}
.state-box{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.state-box.ok{background:var(--good-bg);color:var(--good)}
.state-box.warn{background:var(--warn-bg);color:var(--warn)}
.state-box.bad{background:var(--bad-bg);color:var(--bad)}
.state-box.info{background:var(--info-bg);color:var(--info)}
.state-box strong{display:block}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}

/* skeleton */

/* =====================================================================================
   1. DETERMINISTIC UTILITIES
   No Math.random and no device clock. Every value derives from a string key, so the same
   scenario always renders the same numbers on every machine.
   ===================================================================================== */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}h^=h>>>16;h=Math.imul(h,0x85ebca6b)>>>0;h^=h>>>13;h=Math.imul(h,0xc2b2ae35)>>>0;h^=h>>>16;return h>>>0}
function rnd(key){let t=(hashStr(key)+0x6D2B79F5)>>>0;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}

/* Dates are 'YYYY-MM-DD' strings. Times are naive Europe/Copenhagen wall-clock milliseconds
   (UTC arithmetic used only as a calendar, never converted to a device time zone). */
const DAY=864e5, HOUR=36e5, MIN=6e4;
const Dt={
  p(s){const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)},
  s(t){return new Date(Math.floor(t/DAY)*DAY).toISOString().slice(0,10)},
  add(s,n){return Dt.s(Dt.p(s)+n*DAY)},
  wd(s){return (new Date(Dt.p(s)).getUTCDay()+6)%7},          // 0 = Monday
  diff(a,b){return Math.round((Dt.p(a)-Dt.p(b))/DAY)},
  y(s){return +s.slice(0,4)}, m(s){return +s.slice(5,7)}, d(s){return +s.slice(8,10)},
  ymd(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`},
  dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()},
};
const T=(date,h)=>Dt.p(date)+h*HOUR;
const hm=t=>{const d=new Date(t);return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`};

const WDS=['man.','tirs.','ons.','tors.','fre.','lør.','søn.'];
const MON=['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];

function isoWeek(s){const th=Dt.add(s,3-Dt.wd(s));const y=Dt.y(th);return{year:y,week:1+Math.floor(Dt.diff(th,`${y}-01-01`)/7)}}

/* Danish public holidays and trading-relevant days. Movable ones follow Easter
   (anonymous Gregorian computus). Store bededag is not a holiday from 2024. */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return Dt.ymd(y,mo,da)}

const FIXED=[['01-01','Nytårsdag'],['06-05','Grundlovsdag'],['12-24','Juleaften'],['12-25','Juledag'],['12-26','2. juledag'],['12-31','Nytårsaften']];

function holidays(y){if(_hol[y])return _hol[y];const e=easter(y),h={};for(const[o,n]of MOVABLE)h[Dt.add(e,o)]={name:n,movable:true};for(const[md,n]of FIXED)h[`${y}-${md}`]={name:n,movable:false};return _hol[y]=h}

   2. TRADING CALENDAR AND COMPARABLE-PERIOD MAPPING
   A trading day D runs from D at the cutoff hour until D+1 at the cutoff hour.

   ===================================================================================== */

  calendar(s){let y=Dt.y(s)-1,m=Dt.m(s),d=Dt.d(s);let why=`Samme kalenderdato i ${y}`;if(m===2&&d===29){d=28;why+=' (29. feb. findes ikke; bruger 28. feb.)'}return{date:Dt.ymd(y,m,d),rule:'calendar',why}},
  holiday(s){const h=holiday(s),hn=holiday(Dt.add(s,1));
    if(h&&h.movable){const d=holidayDate(Dt.y(s)-1,h.name);return{date:d,rule:'holiday',why:`Samme helligdag sidste år (${h.name})`}}

    return null},
};

function focusNight(tid=S.tenant||'soehesten'){return memo('focus|'+tid,()=>dayContext(tid).date)}
function scenarioSalesFactor(tid,night){const sc=scen();return sc.salesFactor&&night===focusNight(tid)?sc.salesFactor:1}
function nightGross(tid,night){return memo(`ng|${tid}|${night}`,()=>{
  const t=TENANTS[tid],wd=Dt.wd(night),y=Dt.y(night);
  const h=holiday(night),hn=holiday(Dt.add(night,1));
  if(h&&h.name==='Juleaften')return 0;
  let g=t.base[wd]*t.season[Dt.m(night)-1]*(t.growth[y]||1);
  if(h&&h.name==='Nytårsaften')g*=2;else if(h)g*=t.holidayFx;else if(hn&&hn.name!=='Juleaften')g*=t.eveFx;
  g*=0.92+0.16*rnd(`${tid}|night|${night}`);
  return g*scenarioSalesFactor(tid,night);
})}
function openHours(tid,night){const t=TENANTS[tid];if(nightGross(tid,night)===0)return null;return t.hours[Dt.wd(night)]}
function hourWeights(tid,night){return memo(`hw|${tid}|${night}`,()=>{
  const t=TENANTS[tid],oh=openHours(tid,night);if(!oh)return null;const[o,c]=oh,w={};let sum=0;
  for(let h=o;h<c;h++){const v=t.shape(Dt.wd(night),h+.5)*(0.85+0.3*rnd(`${tid}|hw|${night}|${h}`));w[h]=v;sum+=v}
  for(const h in w)w[h]/=sum;return w;
})}
/* One simulated OnlinePOS hour, as the connector would deliver it (line totals, not a model). */
function posHour(tid,date,h){return memo(`ph|${tid}|${date}|${h}`,()=>{
  const night=h<6?Dt.add(date,-1):date,hh=h<6?h+24:h;
  const w=hourWeights(tid,night);if(!w||!w[hh])return null;
  const t=TENANTS[tid],gross=nightGross(tid,night)*w[hh],mix=t.mix(hh),byCat={};
  for(const[g]of GROUPS)byCat[g]=gross*(mix[g]||0);
  const k=`${tid}|${date}|${h}`;
  const tx=Math.max(1,Math.round(gross/t.ticket(hh)*(0.94+0.12*rnd(k+'tx'))));
  const late=hh>=TENANTS[tid].hours[Dt.wd(night)][1]-1;
  let cxN=Math.floor(tx*0.006+rnd(k+'cx')),cxAmt=cxN*(90+80*rnd(k+'cxa'));

  if(sc.cancel&&night===focusNight(tid)&&hh>=22&&hh<=25){cxN=Math.round(cxN*sc.cancel+2);cxAmt=cxN*(150+60*rnd(k+'cxb'))}
  return{night,hh,gross,byCat,tx,disc:gross*(0.011+0.012*rnd(k+'d')),staff:gross*(late?0.05:0.004)*(0.6+0.8*rnd(k+'s')),
    voids:Math.floor(tx*0.008+rnd(k+'v')),cxN,cxAmt,cxReg2:sc.cancel&&night===focusNight(tid)&&hh>=22&&hh<=25};
})}

/* Source-state effects on what the connector has delivered */
function posDataUntil(){const st=srcState('pos'),n=NOW(),ctx=dayContext(S.tenant);
  if(st==='stale')return ctx.complete?T(ctx.date,23+52/60):n-47*MIN;
  if(st==='unavailable')return ctx.complete?T(ctx.date,21+52/60):n-48*MIN;
  return n}
function posGap(tid,date,h){return srcState('pos')==='partial'&&date===focusNight(tid)&&(h===19||h===20)}
function posUnmapped(tid,date){const d=Dt.diff(focusNight(tid),date);return srcState('pos')==='mapping'&&d>=0&&d<=12}

/* Aggregate OnlinePOS lines over [t0,t1). Clamped to what the source has delivered.
   Returns totals plus quality facts; missing data is never replaced with zero or estimates. */
function sales(tid,t0,t1,opt={}){
  const clamp=opt.noClamp?t1:Math.min(t1,posDataUntil(),NOW());
  return memo(`sales|${tid}|${t0}|${t1}|${clamp}|${cfg(tid).cutoff}|${srcState('pos')}`,()=>{
    const a={gross:0,vat:0,ex:0,byCat:{},byCatEx:{},tx:0,disc:0,staff:0,voids:0,cxN:0,cxAmt:0,cxReg2N:0,missingHours:[],unmappedEx:0,until:clamp};
    for(const[g]of GROUPS){a.byCat[g]=0;a.byCatEx[g]=0}
    for(let t=Math.floor(t0/HOUR)*HOUR;t<clamp;t+=HOUR){
      const f=(Math.min(t+HOUR,clamp)-Math.max(t,t0))/HOUR;if(f<=0)continue;
      const date=Dt.s(t),h=new Date(t).getUTCHours(),r=posHour(tid,date,h);if(!r)continue;
      let k=f;if(posGap(tid,date,h)){k*=0.6;a.missingHours.push({date,h})}
      for(const[g]of GROUPS){
        let gv=r.byCat[g]*k;
        if(g==='spirit'&&posUnmapped(tid,date)){const u=gv*0.22;gv-=u;a.unmappedEx+=u/(1+POS_PRODUCT_MAP_VAT.unmapped)}
        const vat=gv*POS_PRODUCT_MAP_VAT[g]/(1+POS_PRODUCT_MAP_VAT[g]);
        a.byCat[g]+=gv;a.byCatEx[g]+=gv-vat;a.gross+=gv;a.vat+=vat;
      }
      if(a.unmappedEx){/* unmapped lines still count in totals */}
      a.tx+=r.tx*k;a.disc+=r.disc*k;a.staff+=r.staff*k;a.voids+=r.voids*k;a.cxN+=r.cxN*k;a.cxAmt+=r.cxAmt*k;if(r.cxReg2)a.cxReg2N+=r.cxN*k;
    }
    a.gross+=a.unmappedEx*(1+POS_PRODUCT_MAP_VAT.unmapped);a.vat+=a.unmappedEx*POS_PRODUCT_MAP_VAT.unmapped;
    a.ex=a.gross-a.vat;a.tx=Math.round(a.tx);a.voids=Math.round(a.voids);a.cxN=Math.round(a.cxN);a.cxReg2N=Math.round(a.cxReg2N);
    a.incomplete=clamp<t1;a.lowerBound=a.missingHours.length>0;
    return a;
  })}

/* ---------- Workforce: roster, clock events, corrections ---------- */
function dayIdx(s){return Dt.diff(s,'2024-01-01')}
function roster(tid,night){return memo(`ro|${tid}|${night}`,()=>{
  const t=TENANTS[tid];if(!openHours(tid,night))return[];
  const slots=t.roster[Dt.wd(night)],used=new Set(),out=[],di=dayIdx(night),future=night>dayContext(tid).date;
  slots.forEach((s,i)=>{let emp=null;
    if(s.pin)emp=s.pin;else{const pool=t.pools[s.r];for(let j=0;j<pool.length;j++){const c=pool[(di*2+i*3+j)%pool.length];if(!used.has(c)){emp=c;break}}}
    if(future&&slots.length>3&&i===slots.length-1&&di%3===1)emp=null; /* open shift */
    if(emp)used.add(emp);
    const k=`${tid}|${night}|${i}`,pS=T(night,s.a),pE=T(night,s.b);
    const aIn=pS+Math.round((rnd(k+'in')-0.65)*14)*MIN,aOut=pE+Math.round((rnd(k+'out')-0.3)*30)*MIN;
    out.push({id:`${tid}-${night}-${i}`,night,idx:i,emp,role:s.r,pS,pE,aIn,aOut,planned:true});
  });
  const sc=scen(),fn=focusNight(tid);
  if(night===fn&&sc.extraShift){const extra=Object.keys(MEMBERSHIP_SEED[tid]).find(p=>MEMBERSHIP_SEED[tid][p].role==='employee'&&p!==t.demoEmployee&&!used.has(p));out.push({id:`${tid}-${night}-x`,night,idx:99,emp:extra,role:'Ekstra (ikke planlagt)',pS:null,pE:null,aIn:T(night,19+4/60),aOut:T(night,27.6),planned:false,note:'Indkaldt af bestyrer kl. 18:40'});
    out.forEach(s=>{if(s.planned&&(s.role==='Bar'||s.role==='Bestyrer'))s.aOut+=sc.overrun*MIN})}
  if(sc.forgot!=null&&night===Dt.add(fn,sc.forgot)){const s=out.find(x=>x.emp===t.forgotEmp)||out.find(x=>x.emp&&x.emp!==t.demoEmployee&&x.role!=='Bestyrer');if(s){s.aOut=null;s.forgot=true}}
  /* Historic corrected clock-out for the demo employee: most recent shift before the focus night */
  const cn=correctedNight(tid);
  if(night===cn){const s=out.find(x=>x.emp===t.demoEmployee);if(s){const orig=s.pE+(7*60+12)*MIN;s.aOut=s.pE+4*MIN;s.correction={orig,corrected:s.aOut,actor:tid==='soehesten'?'luca':'maja',at:T(Dt.add(night,1),11+12/60),reason:'Glemte at stemple ud ved lukning og stemplede ud hjemmefra næste morgen. Lukketid bekræftet af bestyrer og kasseafslutningen.',approvedBy:'mathias',approvedAt:T(Dt.add(night,1),11+40/60)}}}
  return out;
})}
function correctedNight(tid){return memo(`cn|${tid}`,()=>{const t=TENANTS[tid];let d=Dt.add(focusNight(tid),-1);for(let i=0;i<14;i++,d=Dt.add(d,-1)){const slots=t.roster[Dt.wd(d)];if(slots.some(s=>s.pin===t.demoEmployee))return d}return null})}
function wfDataUntil(){const st=srcState('wf'),n=NOW(),ctx=dayContext(S.tenant);
  if(st==='stale')return ctx.complete?T(ctx.date,18+28/60):n-132*MIN;
  if(st==='unavailable')return ctx.complete?T(ctx.date,16):n-150*MIN;
  return n}
function manualFix(tid,shiftId){return storeOf(tid).clockFixes.find(f=>f.shiftId===shiftId)||null}
/* Resolve one shift against the workforce feed and in-app corrections */
function shiftView(tid,s){
  const until=Math.min(wfDataUntil(),NOW());
  const fix=manualFix(tid,s.id);
  let aOut=s.aOut,forgot=!!s.forgot,known=true,pending=false;
  if(fix){aOut=fix.corrected;forgot=false;pending=fix.status==='pending'}
  const inKnown=s.aIn<=until;
  let outKnown=aOut!=null&&aOut<=until;
  const onNow=inKnown&&!forgot&&(aOut==null||aOut>until)&&until>=NOW()-10*MIN&&s.aIn<=NOW();
  if(!inKnown)known=false;
  return{...s,aOut,forgot,fix,pending,inKnown,outKnown,onNow,until};

/* Labour over [t0,t1): planned vs actual hours, loaded cost. Unknowns are reported, not zero-filled. */
function labour(tid,t0,t1){
  const until=Math.min(wfDataUntil(),NOW());
  return memo(`lab|${tid}|${t0}|${t1}|${until}|${JSON.stringify(cfg(tid))}|${storeOf(tid).clockFixes.length}|${storeOf(tid).clockFixes.map(f=>f.status).join()}|${srcState('wf')}`,()=>{
    const m=S.memberships[tid],c=cfg(tid),load=1+c.loading/100,st=srcState('wf');
    const r={plan:0,planToNow:0,act:0,cost:0,costUnknownHours:0,unknownWage:[],forgot:[],corrections:[],open:[],byEmp:{},unmapped:0,incomplete:until<Math.min(t1,NOW()),until,extra:[]};
    const endPlan=Math.min(t1,NOW());
    for(let d=Dt.add(Dt.s(t0),-1);d<=Dt.s(t1);d=Dt.add(d,1)){
      for(const raw of roster(tid,d)){const s=shiftView(tid,raw);
        const ov=(a,b,x,y)=>Math.max(0,Math.min(b,y)-Math.max(a,x))/HOUR;
        const ph=s.planned?ov(s.pS,s.pE,t0,t1):0,ptn=s.planned?ov(s.pS,s.pE,t0,endPlan):0;
        if(!s.emp&&s.planned){r.open.push(s);continue}
        let ah=0;
        if(s.inKnown&&!s.forgot){const end=s.aOut!=null?Math.min(s.aOut,until):until;ah=ov(s.aIn,end,t0,t1)}
        if(!ph&&!ah&&!(s.forgot&&ov(s.aIn,s.aIn+1,t0,t1)))continue;
        r.plan+=ph;r.planToNow+=ptn;r.act+=ah;
        const e=r.byEmp[s.emp]||(r.byEmp[s.emp]={emp:s.emp,plan:0,act:0,cost:0,shifts:[],wageKnown:true});
        e.plan+=ph;e.act+=ah;e.shifts.push(s);
        const wage=m[s.emp]?.wage,wageMissing=st==='partial'&&TENANTS[tid].missingWage.includes(s.emp);
        if(wage&&!wageMissing){const cst=ah*wage*load;e.cost+=cst;r.cost+=cst}else{e.wageKnown=false;r.costUnknownHours+=ah;if(!r.unknownWage.includes(s.emp))r.unknownWage.push(s.emp)}
        if(s.forgot)r.forgot.push(s);
        if(s.correction||s.fix)r.corrections.push(s);
        if(!s.planned)r.extra.push(s);
      }
    }
    if(st==='mapping'){const fn=focusNight(tid);const a=Math.max(0,Math.min(T(fn,23),until,t1)-Math.max(T(fn,18.5),t0))/HOUR;if(a>0){r.unmapped=a;r.act+=a;r.costUnknownHours+=a}}
    return r;
  })}

/* ---------- Accounting: purchases (e-conomic) and stock counts (entered in app) ---------- */
function monthKey(y,m){return `${y}-${String(m).padStart(2,'0')}`}
function prevMonth(y,m){return m===1?[y-1,12]:[y,m-1]}
function stockCount(tid,y,m){const t=TENANTS[tid];if(t.missingCounts.includes(monthKey(y,m)))return null;const o={};for(const[g]of GROUPS)o[g]=t.stockBase[g]*(0.85+0.3*rnd(`${tid}|stock|${y}|${m}|${g}`));return o}
function monthSales(tid,y,m){const c=cfg(tid).cutoff,first=Dt.ymd(y,m,1),next=m===12?Dt.ymd(y+1,1,1):Dt.ymd(y,m+1,1);return sales(tid,T(first,c),T(next,c),{noClamp:true})}
function accState(){return srcState('acc')}
function monthCM(tid,y,m){return memo(`cm|${tid}|${y}|${m}|${cfg(tid).cutoff}|${accState()}|${srcState('pos')}`,()=>{
  const t=TENANTS[tid],s=monthSales(tid,y,m),[py,pm]=prevMonth(y,m),open=stockCount(tid,py,pm),close=stockCount(tid,y,m);
  const measured=!!(open&&close);const g={};let ex=0,cogs=0,purchT=0;const st=accState();
  for(const[k]of GROUPS){
    const trueCogs=s.byCatEx[k]*(1-t.cm[k])*(0.96+0.08*rnd(`${tid}|cogs|${y}|${m}|${k}`));
    const o=open?open[k]:t.stockBase[k],c=close?close[k]:t.stockBase[k]*(0.85+0.3*rnd(`${tid}|stock|${y}|${m}|${k}`));
    let purch=trueCogs+c-o;
    const cg=measured?(o+purch-c):purch;
    g[k]={ex:s.byCatEx[k],purch,cogs:cg,cm:s.byCatEx[k]?(s.byCatEx[k]-cg)/s.byCatEx[k]:null};
    ex+=s.byCatEx[k];cogs+=cg;purchT+=purch;
  }
  ex+=s.unmappedEx;
  const r={y,m,ex,cogs,purch:purchT,groups:g,measured,openCounted:!!open,closeCounted:!!close,missingInvoices:0,unmappedAcct:0,unmappedPosEx:s.unmappedEx};
  const isLast=(()=>{const[ly,lm]=lastClosedMonth(tid);return ly===y&&lm===m})();
  if(isLast&&st==='partial'){r.missingInvoices=9840;r.cogs-=9840;r.purch-=9840;r.measured=false;r.partialNote='2 leverandørfakturaer for måneden er ikke bogført endnu (ca. 9.840 kr.)'}
  if(isLast&&st==='mapping'){r.unmappedAcct=8420;g.spirit.cogs-=8420;g.spirit.cm=(g.spirit.ex-g.spirit.cogs)/g.spirit.ex;}

function lastClosedMonth(tid){const d=Dt.s(NOW());let y=Dt.y(d),m=Dt.m(d);return prevMonth(y,m)}
function rolling12(tid,y,m){let ex=0,cogs=0,measured=0,months=[];let yy=y,mm=m;for(let i=0;i<12;i++){const r=monthCM(tid,yy,mm);ex+=r.ex;cogs+=r.cogs;if(r.measured)measured++;months.push(r);[yy,mm]=prevMonth(yy,mm)}return{ex,cogs,cm:(ex-cogs)/ex,measured,months}}

/* Which day the "day" card shows: today's trading day once the venue has opened, otherwise

function dayContext(tid){const n=NOW(),c=cfg(tid).cutoff,td=tradingDate(n,c);
  const oh=TENANTS[tid].hours[Dt.wd(td)];const opened=oh&&n>=T(td,oh[0]);

  const d=Dt.add(td,-1);return{date:d,complete:true,start:T(d,c),end:T(td,c),label:'I går'};
}
function periodDefs(tid){const c=cfg(tid).cutoff,ctx=dayContext(tid),d=ctx.date,end=ctx.end,mode=S.cmpMode;
  const dayMap=mode==='calendar'?CMP.calendar(d):mode==='holiday'?(CMP.holiday(d)||CMP.weekday(d)):CMP.weekday(d);

  const first=Dt.ymd(Dt.y(d),Dt.m(d),1),lyFirst=Dt.ymd(Dt.y(d)-1,Dt.m(d),1),jan=`${Dt.y(d)}-01-01`,lyJan=`${Dt.y(d)-1}-01-01`;
  const mk=(id,label,sub,from,lyFrom,cmpText,rule)=>{const t0=T(from,c),dur=end-t0,l0=T(lyFrom,c);const lyTo=Dt.s(l0+dur-1-c*HOUR);
    return{id,label,sub,from,to:d,t0,t1:end,lyFrom,lyTo,l0,l1:l0+dur,cmpText,rule,hol:holidayMismatch(from,d,lyFrom,lyTo)}};
  const until=ctx.complete?'':` til kl. ${hm(end)}`;
  return{
    day:mk('day',ctx.label,fDate(d),d,dayMap.date,`${fDate(dayMap.date,{year:true})}${until}`,dayMap),
    week:mk('week',`Uge ${iw.week}`,`${fDate(mon,{noWd:true})}–${fDate(d,{noWd:true})}`,mon,lyMon,`uge ${iw.week} ${iw.year-1}, man.–${WDS[Dt.wd(d)]}${until}`,{rule:'isoweek',why:`Samme ISO-uge sidste år, mandag til samme ugedag${until}`}),
    month:mk('month',MON[Dt.m(d)-1][0].toUpperCase()+MON[Dt.m(d)-1].slice(1),`1.–${Dt.d(d)}. ${MONS[Dt.m(d)-1]}`,first,lyFirst,`1.–${Dt.d(d)}. ${MONS[Dt.m(d)-1]} ${Dt.y(d)-1}${until}`,{rule:'calmonth',why:'Samme kalenderdatoer sidste år'}),
    ytd:mk('ytd','År til dato',`1/1–${fShort(d)}`,jan,lyJan,`1/1–${fShort(d)} ${Dt.y(d)-1}${until}`,{rule:'ytd',why:'Samme kalenderdatoer sidste år'}),
    ctx};
}
function weekdayMix(from,to){const c=[0,0,0,0,0,0,0];for(let d=from;d<=to;d=Dt.add(d,1))c[Dt.wd(d)]++;return c}
function periodSales(tid,p){

function tone(pct){if(pct==null)return'na';if(pct>3)return'good';if(pct>=-3)return'warn';return'bad'}
function labourTone(p,c){if(p==null)return'na';if(p>c.target[1])return'bad';if(p<c.target[0])return'warn';return'good'}

function labourSummary(tid,p){
  const wf=srcState('wf'),pos=srcState('pos'),c=cfg(tid);
  const L=labour(tid,p.t0,p.t1),Sx=sales(tid,p.t0,p.t1),LL=labour(tid,p.l0,p.l1),SL=sales(tid,p.l0,p.l1,{noClamp:true});
  let pct=null,bound=null,blocked=null,partial=null;const qual=[];
  if(wf==='loading'||pos==='loading')blocked='loading';
  else if(wf==='unavailable')blocked=`Vagtplan svarer ikke. Sidste data ${fStamp(L.until)}.`;
  else if(pos==='unavailable')blocked='OnlinePOS svarer ikke, så omsætningen er ukendt.';
  else if(L.incomplete){blocked=`Vagtdata findes kun til ${fStamp(L.until)}.`;const Lp=labour(tid,p.t0,Math.min(p.t1,L.until)),Sp=sales(tid,p.t0,Math.min(p.t1,L.until));if(Sp.ex)partial={pct:Lp.cost/Sp.ex*100,until:L.until}}
  else if(Sx.incomplete)blocked=`Kassedata findes kun til ${fStamp(Sx.until)}.`;
  else{
    pct=Sx.ex?L.cost/Sx.ex*100:null;
    if(L.costUnknownHours>0){bound='min';qual.push(`${hrs(L.costUnknownHours)} uden kendt lønsats`)}
    if(L.forgot.length){bound='min';qual.push(`${L.forgot.length} åben stempling ikke medregnet`)}
    if(Sx.lowerBound){bound=bound==='min'?'unknown':'max';qual.push('omsætning ufuldstændig')}
  }
  const lyPct=SL.ex?LL.cost/SL.ex*100:null;
  let tn='na';if(pct!=null){if(!bound)tn=labourTone(pct,c);else if(bound==='min'&&pct>c.target[1])tn='bad';else if(bound==='max'&&pct<c.target[0])tn='warn'}
  return{L,Sx,LL,SL,pct,lyPct,bound,blocked,partial,qual,tn,c};
}

    const wk=labour(tid,P.week.t0,P.week.t1);

  }

}

function vHomeDetailed(sc){

  const cur=periodSales(tid,P.day).cur,norm=normalControls(tid,P.day.from);

  const rosterHtml=`<section class="ref-panel ref-roster">${head('Vagter i dag',`<span class="pill">${esc(fDate(td))}</span>`)}${shifts.slice(0,3).map(s=>`<div class="ref-shift"><span>${s.emp?esc(pn(s.emp)):'Ledig vagt'}<small>${esc(s.role)}</small></span><span>${hm(s.pS)}</span></div>`).join('')}<a class="ref-more" href="#/${tid}/labour">${shifts.length>3?'+ '+(shifts.length-3)+' mere':'Se vagtplan'} <span>I morgen →</span></a></section>`;

function salesTile(tid,p){
  const pos=srcState('pos');if(pos==='loading')return skelTile(p.label);
  const href=`#/${tid}/sales/${p.id}`;
  const name=`${p.label}, ${p.sub}`;
  if(pos==='unavailable'){const r=sales(tid,p.t0,p.t1);
    return`<div class="tile"><a class="lbl stretch" href="${href}">${esc(p.label)}</a><span class="per">${esc(p.sub)}</span><span class="big" aria-label="Ukendt">—</span><span class="inc">Ukendt: OnlinePOS svarer ikke</span><span class="flag bad">Sidst modtaget ${esc(fStamp(r.until))}: ${kr(r.ex)}${r.until<p.t1?' (ufuldstændigt)':''}</span>${srcBtn(['pos'],'salesEx',p.id)}</div>`}
  const r=periodSales(tid,p);
  const hol=p.hol?`<span class="flag warn" title="Helligdag forskudt"><span aria-hidden="true">⚑</span> ${esc(holText(p.hol))}</span>`:'';

  return`<div class="tile"><a class="lbl stretch" href="${href}" aria-label="${esc(name)}: se salgsdetaljer">${esc(p.label)}</a><span class="per">${esc(p.sub)}</span>

  ${deltaChip(r.cur.ex,r.ly.ex,{comparable:r.comparable,reason:'data mangler'})}
  <span class="cmp">vs. ${esc(p.cmpText)}: ${kr(r.ly.ex)}</span>${hol}${stale}${srcBtn(['pos'],'salesEx',p.id)}</div>`;

function holText(h){const a=h.onlyCur.map(x=>x.name),b=h.onlyLy.map(x=>x.name);
  if(a.length&&!b.length)return`${a.join(', ')} kun i år`;if(b.length&&!a.length)return`${b.join(', ')} kun sidste år`;return`Helligdage forskudt: ${[...new Set([...a,...b])].join(', ')}`}
function gauge(pct,c,max=50){const x=v=>Math.max(0,Math.min(100,v/max*100));

function labourTile(tid,P){

  ${srcBtn(['wf','pos'],'labourPct','day')}</section>`;

   ${L.open.length?`<p class="small muted">${L.open.length} ledig vagt i perioden.</p>`:''}${srcBtn(['wf'],'hours',p.id)}</section>`;
  return pageHead('Personale',esc(p.sub))+tb+banner+kpi+`<div class="two" style="margin-top:12px">${exHtml}${rosterCard(sc)}</div><div style="margin-top:12px">${empHtml}</div>`;

function shiftDetail(tid,s,role){
  const over=s.pE&&Dt.s(s.pE)!==s.night;const d=x=>`${hm(x)}${Dt.s(x)!==s.night?' (+1)':''}`;

  <div>Planlagt: ${s.pS?`${d(s.pS)}–${d(s.pE)}`:'ikke planlagt'} · Stemplet: ${s.inKnown?d(s.aIn):'ukendt'}–${s.forgot?'<strong class="err-text">mangler</strong>':s.aOut&&s.outKnown?d(s.aOut):s.onNow?'på vagt nu':'ukendt'}</div>`;
  if(s.correction){const k=s.correction;h+=`<div class="small" style="margin-top:4px"><strong>Rettet stempling.</strong> Oprindelig udstempling ${d(k.orig)} → rettet til ${d(k.corrected)}. Rettet af ${esc(pn(k.actor))} ${esc(fStamp(k.at))}. Årsag: "${esc(k.reason)}" Godkendt af ${esc(pn(k.approvedBy))} ${esc(fStamp(k.approvedAt))}. Den oprindelige hændelse bevares.</div>`}
  if(s.fix){const k=s.fix;h+=`<div class="small" style="margin-top:4px"><strong>${k.status==='pending'?'Rettelse afventer godkendelse':'Rettet stempling'}.</strong> Udstempling sat til ${d(k.corrected)} af ${esc(pn(k.actor))} ${esc(fStamp(k.at))}. Årsag: "${esc(k.reason)}"${k.approvedBy?` Godkendt af ${esc(pn(k.approvedBy))} ${esc(fStamp(k.approvedAt))}.`:''}</div>`}

  if(acc==='unavailable')return pageHead('Dækningsgrad')+`<div class="state-box bad"><strong>e-conomic svarer ikke.</strong>Varekøb er ukendt, så ingen dækningsgrad vises. Omsætningen alene er ikke nok.</div>`;
  const r=monthCM(tid,y,m),ly=monthCM(tid,y-1,m),r12=rolling12(tid,y,m);

  `<div class="sales-grid"><div class="tile"><span class="lbl">${esc(MON[m-1])} ${y}</span><span class="big">${pc(r.cm*100)}</span>${b(r)}<span class="cmp">Omsætning ${kr(r.ex)} · vareforbrug ${kr(r.cogs)}</span>${srcBtn(['acc','pos'],'cm','')}</div>
  <div class="tile"><span class="lbl">${esc(MON[m-1])} ${y-1}</span><span class="big">${pc(ly.cm*100)}</span>${b(ly)}<span class="cmp">${deltaPts((r.cm-ly.cm)*100)} i år</span></div>
  <div class="tile"><span class="lbl">Rullende 12 mdr.</span><span class="big">${pc(r12.cm*100)}</span><span class="badge ${r12.measured===12?'measured':'indicative'}">${r12.measured} af 12 målt</span><span class="cmp">Udjævner enkeltstående skæve indkøb</span></div></div>
  ${acc!=='normal'?`<div class="state-box warn" style="margin-top:12px"><strong>${esc(SRC_PROBLEM.acc[acc]?.short||('e-conomic: '+srcInfo('acc').label))}</strong>${esc(SRC_PROBLEM.acc[acc]?.long||'Nye bilag kan mangle. Tallene er markeret, hvor det har betydning.')}</div>`:''}
  <section class="card" style="margin-top:12px" aria-labelledby="h-grp"><h3 id="h-grp">Pr. varegruppe · ${esc(MON[m-1])} ${y}</h3><div class="tablewrap" tabindex="0" role="region"><table><thead><tr><th>Gruppe</th><th class="num">DG</th><th class="num">Sidste år</th><th class="num">Forskel</th><th class="num">Omsætning</th><th class="num">Vareforbrug</th></tr></thead><tbody>${groups}</tbody></table></div>
  ${r.unmappedAcct?`<p class="small err-text">Konto 1330 "Varekøb øvrigt" (${kr(r.unmappedAcct)}) er ikke fordelt på en gruppe, men indgår i totalen.</p>`:''}${r.unmappedPosEx?`<p class="small err-text">${kr(r.unmappedPosEx)} salg uden varegruppe i kassen indgår i totalen, men ikke i grupperne.</p>`:''}
  <p class="small muted">Fadøl og cocktails er typisk der, hvor spild og fri hånd koster mest. Pr. gruppe kræver, at varekøb er konteret pr. varegruppe.</p></section>
  <section class="card" style="margin-top:12px" aria-labelledby="h-13"><h3 id="h-13">Seneste 13 måneder</h3><div class="tablewrap" tabindex="0" role="region"><table><thead><tr><th>Måned</th><th class="num">DG</th><th>Status</th><th class="num">Omsætning</th><th>Lageroptælling</th></tr></thead><tbody>${months.map(x=>`<tr><td class="nowrap">${MONS[x.m-1]} ${x.y}</td><td class="num">${pc(x.cm*100)}</td><td>${b(x)}</td><td class="num">${kr(x.ex)}</td><td class="small">${x.openCounted?'start ✓':'<span class="warn-text">start mangler</span>'} · ${x.closeCounted?'slut ✓':'<span class="warn-text">slut mangler</span>'}</td></tr>`).join('')}</tbody></table></div>

function deltaPts(v){return`${v>=0.05?'+':v<=-0.05?'−':'±'}${nf1.format(Math.abs(v))} pct.-point`}

const WD_EN=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function resStore(tid){const s=storeOf(tid);return s.res||(s.res=seedReservations(tid))}
function resDay(tid,date,exceptId){const rows=resStore(tid).rows.filter(r=>r.date===date&&r.id!==exceptId);return{count:rows.length,guests:rows.reduce((a,r)=>a+(+r.guests||0),0),rows}}
function resMissing(f){const m=[];if(!f.date)m.push('dato');if(!f.time)m.push('tidspunkt');if(!f.guests)m.push('antal gæster');return m}
function resFill(sc,r){const tpl=RES_TEMPLATES.find(t=>t.id===r.template);if(!tpl)return'';const f=r.fields;const miss=resMissing(f);
  const join=a=>a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a[0]||'';
  return tpl.body.replace(/\{(\w+|tilføjelse)\}/g,(m,k)=>({fornavn:(f.name||r.from).split(' ')[0],antal:f.guests||'[antal]',dato:f.date?`${WD_EN[Dt.wd(f.date)]} ${Dt.d(f.date)} ${MON_EN[Dt.m(f.date)-1]} ${Dt.y(f.date)}`:'[date]',tid:f.time||'[tid]',firma:f.company||'[firma]',sted:sc.t.name,betingelser:sc.tid==='soehesten'?RES_TERMS:'[Rannør house rules and approved templates are still required.]',mangler:join(miss.map(x=>({'dato':'the date','tidspunkt':'the arrival time','antal gæster':'the number of guests'}[x])))||'[oplysninger]',tilføjelse:r.extra?'\n\n'+r.extra:''}[k]??m));
}
function resBookingRule(tid,f){
  if(tid==='rannor'&&f.date&&Dt.wd(f.date)===4)return 'Rannør tager som udgangspunkt ikke reservationer om fredagen. Foreslå en anden dag, eller overtag selv.';
  const limit=tid==='soehesten'?'21:00':'20:00';
  if(f.time&&f.time>limit)return `Ankomst efter ${limit}. Foreslå et tidligere tidspunkt, eller overtag selv for en undtagelse.`;
  if(tid==='soehesten'&&f.date&&Dt.wd(f.date)===1)return 'Tirsdag er quiz: ingen reservationer. Overtag mailen og foreslå en anden dag.';
  if(tid==='soehesten'&&f.date&&[2,3].includes(Dt.wd(f.date))&&f.time&&f.time>='20:00')return 'Onsdag/torsdag: kun ankomst før 20:00, og der kan ikke reserveres til jazz.';
  return '';
}
function resReminder(tid,r){const f=r.fields;if(!f.date)return`<div class="state-box warn" id="res-rem-${r.id}"><strong>Dato mangler.</strong>Påmindelsen kan først vises, når datoen er kendt.</div>`;

function resCard(sc,r){
  const tid=sc.tid,f=r.fields;
  const prior=resStore(tid).history.filter(x=>x.email===r.email).length;
  const head=`<summary class="ressum"><div><h3 id="rh-${r.id}">${esc(f.name||r.from)}${f.guests?` · ${esc(f.guests)} pers.`:''}${f.date?` · ${esc(fDate(f.date))}`:''}</h3><div class="small muted">${esc(r.subject)} · modtaget ${esc(fStamp(r.receivedAt))} · ${esc(r.email)}</div></div>${r.escalate?'<span class="badge urgent">Overtag selv</span>':`<span class="badge brand">${esc(RES_TEMPLATES.find(t=>t.id===r.template)?.name||'')}</span>`}</summary>
  <details class="tbl"><summary>Vis den oprindelige mail</summary><div class="note" style="white-space:pre-wrap;background:var(--surface-2);border-color:var(--line-2)">${esc(r.body)}</div></details>`;

  if(r.escalate)return`<article class="card" id="res-${r.id}" aria-labelledby="rh-${r.id}"><details class="resd" data-resd="${r.id}" ${open}>${head}<div class="state-box warn"><strong>Intet udkast. Mathias overtager.</strong>${esc(r.escalate)}</div><div class="toolbar"><button class="btn primary" type="button" data-act="res-manual" data-id="${r.id}">Jeg har overtaget mailen</button></div></details></article>`;
  const fld=(k,l,type,extra='')=>`<div><label class="f" for="rf-${r.id}-${k}">${l}</label><input id="rf-${r.id}-${k}" type="${type}" data-res="${r.id}" data-k="${k}" value="${esc(f[k]??'')}" ${extra}></div>`;
  const miss=resMissing(f);
  return`<article class="card" id="res-${r.id}" aria-labelledby="rh-${r.id}"><details class="resd" data-resd="${r.id}" ${open}>${head}
  ${r.lang==='en'?'<p class="flag warn" style="display:flex">Gæsten skriver på engelsk. Svaret er på engelsk, som aftalt.</p>':''}
  ${prior?`<p class="small"><strong>Tidligere gæst:</strong> ${prior} tidligere reservation${prior===1?'':'er'} med denne e-mail i denne virksomhed.</p>`:''}
  ${resReminder(tid,r)}<p class="state-box warn" id="res-rule-${r.id}" ${resBookingRule(tid,f)?'':'hidden'}>${esc(resBookingRule(tid,f))}</p>
  <fieldset style="border:0;padding:0;margin:8px 0 0"><legend class="small" style="font-weight:650">Aflæst fra mailen. Tjek felterne, før du godkender.</legend>
  <div class="resgrid">${fld('date','Dato','date')}${fld('time','Ankomst','time')}${fld('guests','Antal gæster','number','min="1" max="200"')}${fld('name','Navn','text')}${fld('table','Bord/rum','text')}${fld('comment','Kommentar','text')}</div></fieldset>
  ${miss.length?`<p class="small warn-text" id="res-miss-${r.id}">Mangler: ${esc(miss.join(', '))}.</p>`:`<p class="small" id="res-miss-${r.id}"></p>`}
  <label class="f" for="rt-${r.id}">Standardsvar</label><select id="rt-${r.id}" data-res="${r.id}" data-k="template">${RES_TEMPLATES.map(t=>`<option value="${t.id}" ${t.id===r.template?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
  <p class="small muted" style="margin:4px 0 0">Foreslået: ${esc(RES_TEMPLATES.find(t=>t.id===r.suggested)?.name||'')}. ${esc(r.reason)} ${sc.tid==='soehesten'?'Engelsk prøveudkast baseret på de modtagne skabeloner.':'Engelsk pladsholder. Rannørs egne skabeloner mangler.'}</p>
  <label class="f" for="rx-${r.id}">Personlig tilføjelse <span class="hint">(valgfri, indsættes i svaret)</span></label><textarea id="rx-${r.id}" data-res="${r.id}" data-k="extra" maxlength="400" style="min-height:60px">${esc(r.extra)}</textarea>
  <h4 style="margin:12px 0 4px;font-size:14px">Svaret der sendes til ${esc(r.email)}</h4><div class="mailprev" id="res-prev-${r.id}">${esc(resFill(sc,r))}</div>
  <p class="formerr" id="res-err-${r.id}" role="alert"></p>
  <div class="toolbar" style="margin:6px 0 0"><button class="btn primary" type="button" data-act="res-send" data-id="${r.id}">Godkend og send</button><button class="btn" type="button" data-act="res-decline" data-id="${r.id}">Send "fuldt booket"</button><button class="btn" type="button" data-act="res-manual" data-id="${r.id}">Overtag selv</button></div></details></article>`;
}
function vReservations(sc,param){
  const{tid}=sc;if(!can.seeSales(sc.role))return noAccess('Reservationer er for ejere og bestyrere.');
  const st=resStore(tid),f=S.resFilter||'pending';
  const pend=st.requests.filter(r=>r.status==='pending'),wait=st.requests.filter(r=>r.status==='sent'||r.status==='asked'),done=st.requests.filter(r=>['confirmed','declined','manual'].includes(r.status));
  const list={pending:pend,waiting:wait,done}[f];
  if(!pend.some(r=>r.id===S.resOpen))S.resOpen=pend[0]?.id||null;
  const empty={pending:'Ingen mails venter på dig.',waiting:'Ingen svar venter på gæsten.',done:'Intet afsluttet endnu.'}[f];
  const small=r=>`<li><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span><strong>${esc(r.fields.name||r.from)}</strong> · ${r.fields.guests?esc(r.fields.guests)+' pers. · ':''}${r.fields.date?esc(fDate(r.fields.date)):''}${r.fields.time?' kl. '+esc(r.fields.time):''}</span><span class="badge neutral">${RES_STATUS[r.status]}</span></div><div class="small muted">${esc(RES_TEMPLATES.find(t=>t.id===r.template)?.name||'Ingen skabelon')}${r.decidedBy?` · ${r.status==='manual'?'overtaget':'godkendt'} af ${esc(pn(r.decidedBy))} ${esc(fStamp(r.decidedAt))}`:''}${r.confirmedAt?` · bekræftet ${esc(fStamp(r.confirmedAt))}`:''}</div>${r.status==='sent'?`<button class="btn small" type="button" data-act="res-confirm" data-id="${r.id}" style="margin-top:6px">Simulér: gæsten har læst reglerne</button>`:''}</li>`;
  const upcoming=st.rows.filter(x=>x.date>=Dt.s(NOW())).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.time<b.time?-1:1).slice(0,40);
  const sheet=`<section class="card" style="margin-top:12px" aria-labelledby="h-sheet"><div class="card-h"><h3 id="h-sheet">Reservationsark</h3><span class="small muted">Google Sheets (simuleret)</span></div>
  <div class="tablewrap" tabindex="0" role="region"><table><thead><tr><th>Dato</th><th>Godkendt</th><th>Navn</th><th class="num">Antal gæster</th><th>Ankomst</th><th>Bord/rum</th><th>Kommentar</th></tr></thead><tbody>${upcoming.map(x=>`<tr${x.fromApp?' style="background:var(--brand-soft)"':''}><td class="nowrap">${esc(fDate(x.date))}</td><td>${x.approved==='ja'?'<span class="good-text"><strong>ja</strong></span>':'nej'}</td><td>${esc(x.name)}</td><td class="num">${esc(x.guests)}</td><td>${esc(x.time)}</td><td>${esc(x.table)}</td><td>${esc(x.comment)}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted">Arket har kun jeres syv kolonner. Mail, status og henvisning til mailtråden gemmer appen selv. Rækker fra appen er fremhævet. "Godkendt" er ja, når en bruger har godkendt bookingen. Gæstens kvittering for husreglerne registreres særskilt i appen.</p></section>`;
  return pageHead('Reservationer',`kun ${esc(sc.t.name)}`)+`<p class="small muted">Prototype: mails og afsendelse er simulerede. Intet sendes, før en person har godkendt. Reservationsmail · hentet ${esc(fStamp(NOW()-2*MIN))}.</p>
  <div class="toolbar"><div class="seg" role="group" aria-label="Filter">${[['pending',`Venter på dig (${pend.length})`],['waiting',`Venter på gæst (${wait.length})`],['done',`Afsluttet (${done.length})`]].map(([k,l])=>`<button type="button" data-act="res-filter" data-id="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div></div>
  ${list.length?(f==='pending'?`<div class="grid">${list.map(r=>resCard(sc,r)).join('')}</div>`:`<section class="card"><ul class="list">${list.map(small).join('')}</ul></section>`):`<div class="card empty">${empty}</div>`}${sheet}`;
}
function resHomeCard(sc){if(!can.seeSales(sc.role))return'';const st=resStore(sc.tid);const p=st.requests.filter(r=>r.status==='pending').length,w=st.requests.filter(r=>r.status==='sent'||r.status==='asked').length;
  return`<section class="span-12 card tight" aria-labelledby="h-res" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3 id="h-res" style="margin:0">Reservationer</h3><div class="small">${p?`<strong>${p} mail${p>1?'s':''} venter på godkendelse</strong>`:'Ingen mails venter på dig'}${w?` · ${w} venter på gæsten`:''}</div></div><a class="btn small ${p?'primary':''}" href="#/${sc.tid}/reservations">${p?'Gennemse':'Åbn'}</a></section>`}
/* Live update of one card without re-rendering the page, so typing keeps focus */
function resOnInput(el){const sc=curScope();if(!sc)return;const r=resStore(sc.tid).requests.find(x=>x.id===el.dataset.res);if(!r)return;const k=el.dataset.k;
  if(k==='template')r.template=el.value;else if(k==='extra')r.extra=el.value;else r.fields[k]=k==='guests'?(el.value===''?'':+el.value):el.value;
  const prev=document.getElementById('res-prev-'+r.id);if(prev)prev.textContent=resFill(sc,r);
  const rem=document.getElementById('res-rem-'+r.id);if(rem)rem.outerHTML=resReminder(sc.tid,r);
  const miss=resMissing(r.fields),mEl=document.getElementById('res-miss-'+r.id);if(mEl){mEl.className=miss.length?'small warn-text':'small';mEl.textContent=miss.length?`Mangler: ${miss.join(', ')}.`:''}
  const rule=document.getElementById('res-rule-'+r.id);if(rule){rule.textContent=resBookingRule(sc.tid,r.fields);rule.hidden=!rule.textContent;}
  const err=document.getElementById('res-err-'+r.id);if(err)err.textContent='';
}
function resAct(act,id){const sc=curScope(),st=resStore(sc.tid),r=st.requests.find(x=>x.id===id);if(!r)return;
  const err=m=>{const e=document.getElementById('res-err-'+id);if(e)e.textContent=m};
  if(act==='res-send'){
    if(RES_NEEDS_BOOKING.includes(r.template)){const miss=resMissing(r.fields);if(miss.length||!r.fields.name){err(`Udfyld ${[...miss,...(r.fields.name?[]:['navn'])].join(', ')}, eller vælg "Mangler oplysninger".`);return}
      const rule=resBookingRule(sc.tid,r.fields);if(rule){err(rule);return}
      st.rows.push({id:`${sc.tid}-row-app-${r.id}`,date:r.fields.date,approved:'ja',name:r.fields.name,guests:+r.fields.guests,time:r.fields.time,table:r.fields.table,comment:r.fields.comment,fromApp:true});r.rowId=`${sc.tid}-row-app-${r.id}`;r.status='sent';
      toast(`Svar sendt til ${r.email} (simuleret). Reservationen er godkendt og står i arket med "Godkendt: ja".`)}
    else if(r.template==='missing'){r.status='asked';toast(`Svar sendt til ${r.email} (simuleret). Vi venter på gæstens oplysninger.`)}
    else{r.status='declined';toast(`Afslag sendt til ${r.email} (simuleret).`)}
    r.decidedBy=S.user;r.decidedAt=NOW();r.sentText=resFill(sc,r);audit(sc.tid,`Godkendte og sendte svar til ${r.fields.name||r.from} (${RES_TEMPLATES.find(t=>t.id===r.template).name})`);
  }else if(act==='res-decline'){r.template='full';r.status='declined';r.decidedBy=S.user;r.decidedAt=NOW();r.sentText=resFill(sc,r);audit(sc.tid,`Sendte "fuldt booket" til ${r.fields.name||r.from}`);toast(`"Fuldt booket" sendt til ${r.email} (simuleret).`)}
  else if(act==='res-manual'){r.status='manual';r.decidedBy=S.user;r.decidedAt=NOW();audit(sc.tid,`Overtog reservationsmail fra ${r.fields.name||r.from} manuelt`);toast('Markeret som overtaget. Svar gæsten direkte fra mailen.')}
  else if(act==='res-confirm'){r.status='confirmed';r.confirmedAt=NOW();audit(sc.tid,`${r.fields.name} bekræftede reservationen (simuleret)`);toast(`${r.fields.name} har læst husreglerne. Bookingen var allerede godkendt i arket.`)}
  rerender();
}

function metricDialog(sc,id,pid){
  const m=METRICS[id],tid=sc.tid,P=periodDefs(tid),p=P[pid]||null;
  const srcs=m.src.map(k=>{const i=srcInfo(k);const cls={normal:'ok',loading:'info',stale:'warn',partial:'warn',mapping:'warn',unavailable:'bad'}[i.state];return`<div class="state-box ${cls}"><strong>${esc(i.name)} · ${esc(SRC_STATES.find(x=>x[0]===i.state)[1])}</strong>Seneste hentning ${esc(fStamp(i.last))}. ${i.state==='normal'?'':esc(i.state==='stale'?`Data dækker kun til ${fStamp(i.until)}.`:i.state==='unavailable'?'Tal fra kilden vises som ukendte.':i.state==='loading'?'Tal vises som pladsholdere.':SRC_PROBLEM[k][i.state].long)}</div>`}).join('');
  let inputs='';
  try{
    if(p&&(id==='salesEx'||id==='avgTicket'||id==='controls')&&srcState('pos')!=='unavailable'&&srcState('pos')!=='loading'){const r=periodSales(tid,p);inputs=`<dl class="kv"><dt>Periode</dt><dd>${esc(p.label)}, ${esc(p.sub)}${r.cutAt?` (til ${hm(r.cutAt)})`:''}</dd><dt>Inkl. moms</dt><dd>${kr(r.cur.gross)}</dd><dt>Moms fra varelinjer</dt><dd>${kr(r.cur.vat)}</dd><dt>Ex. moms</dt><dd>${kr(r.cur.ex)}</dd><dt>Antal boner</dt><dd>${nf0.format(r.cur.tx)}</dd><dt>Sammenligning</dt><dd>${esc(p.cmpText)}</dd><dt>Sidste år ex. moms</dt><dd>${kr(r.ly.ex)}</dd></dl><p class="small">${esc(p.rule.why)}.</p>`}
    if(p&&(id==='labourPct'||id==='loaded'||id==='hours'||id==='rph')){const ls=labourSummary(tid,p);inputs=`<dl class="kv"><dt>Periode</dt><dd>${esc(p.label)}, ${esc(p.sub)}</dd><dt>Planlagte timer</dt><dd>${hrs(ls.L.plan)}</dd><dt>Stemplede timer</dt><dd>${ls.L.incomplete?'ufuldstændig':hrs(ls.L.act)}</dd><dt>Belastet løn</dt><dd>${ls.L.incomplete?'—':kr(ls.L.cost)}</dd><dt>Tillægsfaktor</dt><dd>${ls.c.loading} %</dd><dt>Omsætning ex. moms</dt><dd>${srcState('pos')==='unavailable'?'—':kr(ls.Sx.ex)}</dd><dt>Lønprocent</dt><dd>${ls.pct==null?'—':pc(ls.pct)}</dd><dt>Mål</dt><dd>${ls.c.target[0]}–${ls.c.target[1]} %</dd></dl>`}
    if(id==='cm'&&srcState('acc')!=='unavailable'&&srcState('acc')!=='loading'){const[y,mm]=lastClosedMonth(tid),r=monthCM(tid,y,mm);inputs=`<dl class="kv"><dt>Måned</dt><dd>${MON[mm-1]} ${y}</dd><dt>Omsætning ex. moms</dt><dd>${kr(r.ex)}</dd><dt>Varekøb (e-conomic)</dt><dd>${kr(r.purch)}</dd><dt>Lager start</dt><dd>${r.openCounted?'optalt':'mangler'}</dd><dt>Lager slut</dt><dd>${r.closeCounted?'optalt':'mangler'}</dd><dt>Vareforbrug</dt><dd>${kr(r.cogs)}</dd><dt>Status</dt><dd>${r.measured?'Målt':'Indikativ'}</dd></dl>`}
  }catch(e){inputs=''}
  return dlgHead(m.name,'Kilde, friskhed og beregning')+`<div class="dlg-b">${srcs}<h3 style="margin-top:12px">Beregning</h3><div class="formula">${esc(m.formula)}</div><p class="small">${esc(m.notes)}</p>${inputs}<p class="small muted">Tallet er beregnet deterministisk af appen ud fra kildedata. Ingen AI og ingen skøn.</p></div>`;
}

let lastHash=null;
function go(h){if(location.hash===h)render(true);else location.hash=h}
function homeFor(){const ts=myTenants();if(ts.length===1){const t=ts[0];return `#/${t}/${myRole(t)==='employee'?'me':'home'}`}return'#/choose'}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.getElementById('toasts').appendChild(el);document.getElementById('live').textContent=msg;setTimeout(()=>el.remove(),3800)}
const EMP_PAGES=['me','history','tasks','more','rules'];
function render(fromNav){
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const app=document.getElementById('app');let html;
  if(!S.user){html=vLogin()}
  else if(!parts.length||parts[0]==='login'){location.replace(homeFor());return}
  else if(parts[0]==='choose'){S.tenant=null;html=vChoose()}
  else{
    const[tid,page='home',param]=parts;
    let sc;try{sc=scope(tid)}catch(e){document.body.dataset.tenant='';html=`${protoStrip()}<main id="main" class="gate" tabindex="-1"><h1 tabindex="-1" data-pagefocus>Ingen adgang</h1><p>Du har ikke et medlemskab, der giver adgang til denne side. Forsøget er logget.</p><a class="btn primary" href="${homeFor()}">Tilbage</a></main>`;app.innerHTML=html;focusPage(fromNav);return}
    if(S.tenant!==tid){S.tenant=tid;S._payLogged=false;resetMemo();audit(tid,'Åbnede virksomheden');}
    const role=sc.role;let body;
    if(role==='employee'&&!EMP_PAGES.includes(page)){location.replace(`#/${tid}/me`);return}
    switch(page){
      case'home':body=vHome(sc);break;case'sales':body=vSales(sc,param);break;case'labour':body=vLabour(sc);break;case'margin':body=vMargin(sc);break;
      case'tasks':body=vTasks(sc,param);break;case'more':body=vMore(sc);break;case'sources':body=vSources(sc);break;case'rules':body=vRules(sc);break;
      case'reservations':body=vReservations(sc,param);break;case'members':body=vMembers(sc);break;case'log':body=vLog(sc);break;case'settings':body=vSettings(sc);break;case'me':body=vMe(sc);break;case'history':body=vHistory(sc);break;
      default:body=noAccess('Siden findes ikke.');
    }
    const act=['sources','rules','members','log','settings'].includes(page)?'more':page;
    html=frame(sc,act,body);
    app.innerHTML=html;labelTables();
    if(page==='tasks'&&param){const el=document.getElementById('task-'+param);if(el){el.scrollIntoView({block:'center'});el.setAttribute('tabindex','-1');el.focus();return}}
    if(page==='sales'&&param==='controls'&&fromNav){const el=document.getElementById('controls');if(el){el.scrollIntoView();el.setAttribute('tabindex','-1');el.focus();return}}
    focusPage(fromNav);return;
  }
  app.innerHTML=html;labelTables();focusPage(fromNav);
}
/* Scrollable tables are focusable regions; name each after its card heading so landmarks stay unique */
function labelTables(){const seen={};document.querySelectorAll('.tablewrap').forEach(w=>{const h=w.closest('section,details,.card')?.querySelector('h3,summary');let l='Tabel'+(h?': '+h.textContent.trim():'');seen[l]=(seen[l]||0)+1;if(seen[l]>1)l+=` (${seen[l]})`;w.setAttribute('aria-label',l)})}
function focusPage(fromNav){if(!fromNav)return;const h=document.querySelector('[data-pagefocus]');if(h){h.focus({preventScroll:true});window.scrollTo(0,0)}}
window.addEventListener('hashchange',()=>{closeDlg();render(true)});
/* Re-render in place after an action, keeping focus on the equivalent control */
function rerender(){const a=document.activeElement;const key=a&&a.dataset?{act:a.dataset.act,id:a.dataset.id,date:a.dataset.date}:null;render(false);
  if(key&&key.act){const el=document.querySelector(`[data-act="${key.act}"]${key.id?`[data-id="${CSS.escape(key.id)}"]`:''}${key.date?`[data-date="${key.date}"]`:''}`);if(el){el.focus();return}}
  const h=document.querySelector('[data-pagefocus]');if(h&&!dlg.open)h.focus({preventScroll:true})}

function curScope(){return S.tenant?scope(S.tenant):null}
function login(id){S.user=id;S.tenant=null;S.store={};resetMemo();TENANT_IDS.forEach(t=>{if(S.memberships[t][id])audit(t,'Loggede ind via engangslink (simuleret)')});location.hash=homeFor()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;
  const sc=()=>curScope();
  switch(act){
    case'dlg-close':e.preventDefault();closeDlg();break;
    case'dlg-go':closeDlg();break;
    case'scenario':openDlg(scenarioDialog(),b);break;
    case'theme':{const night=document.documentElement.dataset.theme!=='aften';document.documentElement.dataset.theme=night?'aften':'dag';b.textContent='Tema: '+(night?'Aften':'Dag');b.setAttribute('aria-pressed',String(night));try{localStorage.setItem('hospitality-theme',night?'aften':'dag')}catch{}break;}
    case'login-as':login(id);break;
    case'enter':location.hash=`#/${id}/${myRole(id)==='employee'?'me':'home'}`;break;
    case'switch':S.tenant=null;resetMemo();location.hash='#/choose';break;
    case'logout':S.user=null;S.tenant=null;location.hash='#/login';render(true);break;
    case'metric':openDlg(metricDialog(sc(),id,b.dataset.p),b);break;
    case'source':openDlg(sourceDialog(sc(),id),b);break;
    case'issues':openDlg(issuesDialog(sc()),b);break;
    case'note-add':case'day':if(sc().role==='employee')break;openDlg(noteForm(sc(),b.dataset.date),b);break;
    case'task-new':openDlg(taskForm(sc()),b);break;
    case'task-status':{const s=sc(),t=s.store.tasks.find(x=>x.id===id);if(!t)break;const ns=b.dataset.s;t.status=ns;if(ns==='resolved'){t.resolvedBy=S.user;t.resolvedAt=NOW()}else{delete t.resolvedBy;delete t.resolvedAt}audit(s.tid,`Satte opgaven "${t.title}" til ${STATUS_NAME[ns].toLowerCase()}`);toast(`"${t.title}" er nu ${STATUS_NAME[ns].toLowerCase()}.`);rerender();break}
    case'tfilter':S.taskFilter=id;rerender();break;
    case'period':S.salesPeriod=id;history.replaceState(null,'',`#/${S.tenant}/sales/${id}`);rerender();break;
    case'cmp':S.cmpMode=id;resetMemo();rerender();break;
    case'lperiod':S.labourPeriod=id;rerender();break;
    case'fix-clock':openDlg(fixDialog(sc(),id),b);break;
    case'approve-fix':{const s=sc(),f=manualFix(s.tid,id);if(f){f.status='approved';f.approvedBy=S.user;f.approvedAt=NOW();audit(s.tid,`Godkendte rettet stempling for ${pn(shiftById(s.tid,id).emp)}`);resetMemo();toast('Rettelsen er godkendt. Timerne tæller nu med.');rerender()}break}
    case'swap':openDlg(swapDialog(sc(),id),b);break;
    case'swap-approve':{const s=sc(),x=s.store.swaps.find(y=>y.id===id);if(x){x.status='approved';audit(s.tid,`Godkendte vagtbytte ${pn(x.from)} → ${pn(x.to)}`);toast('Vagtbyttet er godkendt (simuleret besked til begge).');rerender()}break}
    case'claim':{const s=sc();s.store.claims.push({id:nid(s.tid,'claim'),shiftId:id,emp:S.user,status:'pending',at:NOW()});audit(s.tid,'Anmodede om en ledig vagt');toast('Anmodning sendt til bestyreren (simuleret).');rerender();break}
    case'claim-approve':{const s=sc(),x=s.store.claims.find(y=>y.id===id);if(x){x.status='approved';audit(s.tid,`Godkendte ledig vagt til ${pn(x.emp)}`);toast('Vagten er tildelt (simuleret).');rerender()}break}
    case'clock':{const s=sc(),type=b.dataset.s;s.store.clockEvents.push({emp:S.user,type,at:NOW()});audit(s.tid,`Stemplede ${type==='in'?'ind':'ud'} (servertid)`);toast(`Stemplet ${type==='in'?'ind':'ud'} kl. ${hm(NOW())}.`);rerender();break}
    case'csv':{const s=sc(),rows=[['dato','rolle','planlagt_start','planlagt_slut','stemplet_ind','stemplet_ud','timer','rettet']];myHistory(s.tid).forEach(x=>rows.push([x.night,x.role,hm(x.pS),hm(x.pE),hm(x.aIn),x.forgot||!x.aOut?'':hm(x.aOut),x.forgot||!x.aOut?'':((x.aOut-x.aIn)/HOUR).toFixed(2),x.correction||x.fix?'ja':'nej']));
      const blob=new Blob(['﻿'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`min-historik-${s.tid}.csv`;document.body.appendChild(a);a.click();a.remove();toast('Din historik er hentet som CSV.');break}
    case'member-remove':openDlg(confirmRemove(sc(),id),b);break;
    case'res-filter':S.resFilter=id;rerender();break;
    case'res-send':case'res-decline':case'res-manual':case'res-confirm':resAct(act,id);break;
  }
});

function formErr(id,msg){const el=document.getElementById(id);if(el)el.textContent=msg}
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fd=new FormData(f),kind=f.dataset.form;
  if(kind==='login'){const em=String(fd.get('email')||'').trim().toLowerCase();if(!em){formErr('lg-err','Skriv din e-mail.');return}
    const id=Object.keys(PEOPLE).find(p=>PEOPLE[p].email===em);const has=id&&TENANT_IDS.some(t=>S.memberships[t][id]&&S.memberships[t][id].status!=='removed');
    if(!has){formErr('lg-err','Der findes ingen invitation til denne e-mail. Adgang kræver en personlig invitation fra en ejer. E-maildomænet giver ikke adgang i sig selv.');return}
    formErr('lg-err','');document.getElementById('lg-sent').innerHTML=`<div class="state-box ok" role="status"><strong>Login-link sendt til ${esc(em)} (simuleret).</strong>Linket virker én gang i 15 minutter.</div><button class="btn primary" type="button" data-act="login-as" data-id="${id}">Åbn login-linket</button>`;return}
  const sc=curScope();
  if(kind==='scenario'){S.scenario=fd.get('sc');S.srcOverride={};['pos','wf','acc'].forEach(k=>{const v=fd.get(k);if(v)S.srcOverride[k]=v});S.store={};S._payLogged=false;resetMemo();closeDlg();toast(`Scenarie: ${scen().name}`);render(false);const h=document.querySelector('[data-pagefocus]');if(h)h.focus();return}
  if(kind==='task'){const title=String(fd.get('title')||'').trim(),as=fd.getAll('assignees');
    if(!title){formErr('tk-err','Giv opgaven en titel.');f.querySelector('#tk-title').focus();return}
    if(!as.length){formErr('tk-err','Vælg mindst én ansvarlig.');return}
    if(as.some(a=>!sc.members[a]||sc.members[a].status==='removed')){formErr('tk-err','Kun personer i denne virksomhed kan tildeles.');return}
    const dd=fd.get('due');const due=dd?T(dd,(()=>{const[h,m]=String(fd.get('duet')||'12:00').split(':').map(Number);return h+m/60})()):null;
    const t={id:nid(sc.tid,'task'),title,desc:String(fd.get('desc')||'').trim(),assignees:as,urgent:!!fd.get('urgent'),due,status:'open',createdBy:S.user,createdAt:NOW(),photo:!!fd.get('photo')};
    sc.store.tasks.unshift(t);audit(sc.tid,`Oprettede opgave "${title}"${t.urgent?' (akut)':''}`);closeDlg();
    toast(`${as.map(pn).join(', ')} får besked på e-mail${t.urgent?' med det samme':''} (simuleret).`);if(t.urgent)S.taskFilter='open';rerender();return}
  if(kind==='note'){const text=String(fd.get('text')||'').trim();if(!text){formErr('nt-err','Skriv en note, eller luk vinduet. Noter er valgfri.');return}
    sc.store.notes.push({id:nid(sc.tid,'note'),date:f.dataset.date,text,by:S.user,at:NOW(),metric:fd.get('metric')||null});audit(sc.tid,`Tilføjede note til ${fDate(f.dataset.date)}`);closeDlg();toast('Noten er gemt.');rerender();return}
  if(kind==='fix'){const reason=String(fd.get('reason')||'').trim(),tm=String(fd.get('time')||'');const s=shiftById(sc.tid,f.dataset.id);
    if(!tm){formErr('fx-err','Angiv et tidspunkt.');return}if(reason.length<5){formErr('fx-err','Skriv en årsag. Rettelser uden årsag gemmes ikke.');f.querySelector('#fx-reason').focus();return}
    const[h,m]=tm.split(':').map(Number);const t=T(h<12?Dt.add(s.night,1):s.night,h+m/60);if(t<=s.aIn){formErr('fx-err','Udstempling skal ligge efter indstemplingen.');return}
    const owner=sc.role==='owner';sc.store.clockFixes.push({shiftId:s.id,corrected:t,actor:S.user,at:NOW(),reason,status:owner?'approved':'pending',approvedBy:owner?S.user:null,approvedAt:owner?NOW():null});
    audit(sc.tid,`Rettede udstempling for ${pn(s.emp)} (${fDate(s.night)}) til ${hm(t)}. Årsag: ${reason}`);resetMemo();closeDlg();toast(owner?'Rettelsen er gemt og godkendt.':'Rettelsen er gemt og afventer ejerens godkendelse.');rerender();return}
  if(kind==='swap'){sc.store.swaps.push({id:nid(sc.tid,'swap'),shiftId:f.dataset.id,from:S.user,to:fd.get('to'),status:'colleague',createdAt:NOW()});audit(sc.tid,'Anmodede om vagtbytte');closeDlg();toast(`Anmodning sendt til ${pn(fd.get('to'))} (simuleret).`);rerender();return}
  if(kind==='remove'){const id=f.dataset.id;sc.members[id].status='removed';audit(sc.tid,`Fjernede adgang for ${pn(id)}`);closeDlg();toast(`${pn(id)} har ikke længere adgang til ${sc.t.name}.`);rerender();return}
  if(kind==='invite'){const name=String(fd.get('name')||'').trim(),email=String(fd.get('email')||'').trim().toLowerCase(),role=fd.get('role');
    if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){formErr('iv-err','Skriv navn og en gyldig e-mail.');return}
    const pid='p'+hashStr(email).toString(36);if(sc.members[pid]&&sc.members[pid].status!=='removed'){formErr('iv-err','Personen er allerede inviteret.');return}
    PEOPLE[pid]={name,short:name.split(' ')[0]+(name.split(' ')[1]?' '+name.split(' ')[1][0]+'.':''),email};sc.members[pid]={role,status:'invited'};
    audit(sc.tid,`Inviterede ${name} som ${ROLE_NAME[role].toLowerCase()}`);toast(`Invitation til ${email} er oprettet (simuleret, intet sendt).`);rerender();return}
  if(kind==='settings'){const c=cfg(sc.tid),cut=+fd.get('cutoff'),mn=+fd.get('tmin'),mx=+fd.get('tmax'),ld=+fd.get('loading');
    if(!(mn>0&&mx>mn&&mx<=60)){formErr('st-err','Målet skal være et interval, hvor "fra" er mindre end "til".');return}if(!(ld>=0&&ld<=60)){formErr('st-err','Tillægsfaktoren skal være mellem 0 og 60 %.');return}
    const ch=[];if(cut!==c.cutoff)ch.push(`skæringstid ${c.cutoff}:00 → ${cut}:00`);if(mn!==c.target[0]||mx!==c.target[1])ch.push(`lønmål ${c.target.join('–')} % → ${mn}–${mx} %`);if(ld!==c.loading)ch.push(`tillæg ${c.loading} % → ${ld} %`);
    c.cutoff=cut;c.target=[mn,mx];c.loading=ld;resetMemo();if(ch.length)audit(sc.tid,`Ændrede indstillinger: ${ch.join(', ')}`);toast(ch.length?'Indstillingerne er gemt. Alle tal er genberegnet.':'Ingen ændringer.');rerender();return}
});

/* =====================================================================================
   24. START
   ===================================================================================== */
S.memberships=JSON.parse(JSON.stringify(MEMBERSHIP_SEED));
for(const t of TENANT_IDS)for(const p in S.memberships[t])S.memberships[t][p].status='active';
/* Optional deep link for testing: #/login?as=mathias&sc=labour is not supported on purpose;
   the scenario switcher is the only test control. */
render(false);
</script>
